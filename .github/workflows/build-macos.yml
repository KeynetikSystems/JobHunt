name: Build macOS app

on:
  workflow_dispatch:

jobs:
  build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest   # arm64 (Apple Silicon)
            arch: arm64
          - os: macos-13       # x86_64 (Intel)
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-desktop.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --name JobHuntAI --windowed --noconfirm \
            --add-data "Main.qml:." \
            --add-data "SettingsField.qml:." \
            --add-data "HistoryCard.qml:." \
            --add-data "ApplicationMaterialsPanel.qml:." \
            main.py

      - name: Verify binary architecture
        run: |
          BIN=dist/JobHuntAI.app/Contents/MacOS/JobHuntAI
          echo "Checking: $BIN"
          ls -la dist/JobHuntAI.app/Contents/MacOS/
          file "$BIN"
          lipo -info "$BIN"
          ACTUAL=$(lipo -info "$BIN" | awk -F': ' '{print $NF}' | xargs)
          echo "Expected: ${{ matrix.arch }} — Actual: [$ACTUAL]"
          if [ "$ACTUAL" != "${{ matrix.arch }}" ]; then
            echo "::error::Architecture mismatch — expected ${{ matrix.arch }}, got [$ACTUAL]"
            exit 1
          fi

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent dist/JobHuntAI.app JobHuntAI-macOS-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: JobHuntAI-macOS-${{ matrix.arch }}
          path: JobHuntAI-macOS-${{ matrix.arch }}.zip
