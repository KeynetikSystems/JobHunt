name: Daily Opportunity Digest

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC every day
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # required to push docs/ archive updates back to the repo

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore deduplication state
        id: cache-seen-items
        uses: actions/cache@v4
        with:
          path: seen_items.json
          key: seen-items-${{ github.run_id }}
          restore-keys: |
            seen-items-

      - name: Run digest (archive only, no email)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # SKIP_EMAIL tells digest_engine.py to still write the dated report and update
          # seen_items.json, but skip the SMTP send. Email delivery is kept as a desktop-app-only
          # feature. Remove this line (and re-add the GMAIL_*/DIGEST_TO_EMAIL secrets) to bring
          # workflow email back.
          SKIP_EMAIL: "true"
        run: python digest_engine.py

      - name: Save deduplication state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen_items.json
          key: seen-items-${{ github.run_id }}

      - name: Update digest archive
        if: success()
        run: python build_archive.py

      - name: Commit archive
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "No archive changes to commit" || git commit -m "Update digest archive"
          git push
